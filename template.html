<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- ====== EDIT DATA DI SINI SAJA ====== -->
      <script>
        const P = {
          nama: "Nama Lengkap",
          jurusan: "Teknik Informatika",
          kampus: "Nama Kampus",
          angkatan: "2023",
          foto: "", // contoh: "budi.jpg" (simpan fotonya di folder foto/). Kosong = inisial
          tagline: "Tulis satu kalimat tentang dirimu.",
          skill: ["HTML/CSS", "JavaScript", "Python"],
          proyek: [{ judul: "Judul Proyek", ket: "Deskripsi singkat proyek" }],
          wa: "6281234567890", // format 62..., tanpa + dan spasi
          email: "nama@email.com",
          links: [
            { label: "GitHub", url: "https://github.com/username" },
            { label: "LinkedIn", url: "https://linkedin.com/in/username" },
            { label: "Instagram", url: "https://instagram.com/username" },
          ],
        };
      </script>
      <!-- ==================================== -->

      <article class="id">
        <div class="slot"></div>
        <div class="chip"></div>
        <div class="photo" id="photo"></div>
        <h1 id="nama"></h1>
        <p class="sub" id="sub"></p>
        <p class="tagline" id="tagline"></p>
      </article>

      <section>
        <h2>Skill</h2>
        <div class="tags" id="skill"></div>
      </section>
      <section id="projSec">
        <h2>Proyek</h2>
        <div id="proj"></div>
      </section>
      <section>
        <h2>Hubungi saya</h2>
        <div class="links" id="kontak"></div>
      </section>
      <section>
        <h2>Link</h2>
        <div class="links" id="links"></div>
      </section>

      <footer>KartuKu.id · Smart ID Card Berbasis QR</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
